<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>남촌물상TV 지식그래프 탐색기</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--ink:#e6edf3;--sub:#8b949e;--line:#30363d;--acc:#d29922;--vid:#58a6ff;--con:#d29922;--cha:#3fb950;--ser:#bc8cff}
*{box-sizing:border-box}body{margin:0;font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0}
header a{color:var(--vid);text-decoration:none;font-size:13px}
#q{flex:1;min-width:220px;padding:9px 13px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:14px}
select{padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink)}
main{display:flex;height:calc(100vh - 62px)}
#graph{flex:1;position:relative}
#graph canvas{display:block}
#side{width:380px;border-left:1px solid var(--line);overflow-y:auto;padding:14px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-bottom:10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
h3{font-size:14px;margin:14px 0 8px;color:var(--acc)}
.item{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--panel);cursor:pointer;font-size:13px}
.item:hover{border-color:var(--acc)}
.item .t{font-weight:600;margin-bottom:3px}
.item .m{color:var(--sub);font-size:12px}
.seg{padding:7px 10px;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer}
.seg:hover{background:#1c2129}
.seg .tt{color:var(--acc);font-variant-numeric:tabular-nums;margin-right:8px;font-size:12px}
.seg mark{background:#634400;color:#ffe08a;padding:0 2px;border-radius:2px}
.empty{color:var(--sub);padding:20px;text-align:center;font-size:13px}
</style>
</head>
<body>
<header>
<h1>남촌물상TV 지식그래프</h1>
<a href="../index.html">← 문서 아카이브</a>
<input id="q" placeholder="개념 또는 자막 전문 검색 (예: 갑기합, 을목 일간, 재물)">
<select id="mode"><option value="auto">자동</option><option value="graph">그래프</option><option value="seg">자막 전문</option></select>
<span id="stat" style="color:var(--sub);font-size:12px"></span>
</header>
<main>
<div id="graph"><canvas id="cv"></canvas></div>
<div id="side"><div class="empty">노드를 클릭하거나 검색하세요</div></div>
</main>
<script src="kg.json"></script>
<script src="segments.json"></script>
<script>
/* kg.json / segments.json은 var KG= / var SEG= 형태로 로딩됨 */
const nodes = KG.nodes, edges = KG.edges, segs = SEG;
const byId = {}; nodes.forEach(n => byId[n.id] = n);
const adj = {}; edges.forEach(e => { (adj[e.s] = adj[e.s] || []).push({ id: e.t, w: e.w, f: e.f, x: e.x }); (adj[e.t] = adj[e.t] || []).push({ id: e.s, w: e.w, f: e.f, x: e.x }); });
const colors = { video: '#58a6ff', series: '#bc8cff', chart: '#3fb950' };
const ccolor = { '일간': '#f0883e', '합충': '#f85149', '십성': '#d2a8ff', '신살': '#79c0ff', '오행': '#56d364', '주제': '#e3b341', '물상론': '#ff7b72', '개념': '#8b949e' };
const cOf = n => n.type === 'video' ? colors.video : n.type === 'series' ? colors.ser : n.type === 'chart' ? colors.cha : (ccolor[n.type] || '#d29922');
const $side = document.getElementById('side'), $stat = document.getElementById('stat'), $q = document.getElementById('q');

/* ---- 캔버스 force graph ---- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W, H, running = false;
function resize() { W = cv.width = cv.parentElement.clientWidth; H = cv.height = cv.parentElement.clientHeight; }
resize(); addEventListener('resize', resize);
// 초기 좌표: 원형 배치
const pos = {}, vel = {};
nodes.forEach((n, i) => { const a = i / nodes.length * Math.PI * 2; pos[n.id] = { x: Math.cos(a) * 400 + 700, y: Math.sin(a) * 400 + 450 }; });
let focusId = null;
function step() {
  // 반발력
  for (const a of nodes) for (const b of nodes) {
    if (a.id >= b.id) continue;
    const dx = pos[b.id].x - pos[a.id].x, dy = pos[b.id].y - pos[a.id].y, d2 = dx * dx + dy * dy + 0.01, f = 60000 / d2;
    const d = Math.sqrt(d2), ux = dx / d, uy = dy / d;
    pos[a.id].x -= ux * f; pos[a.id].y -= uy * f; pos[b.id].x += ux * f; pos[b.id].y += uy * f;
  }
  // 스프링 (엣지)
  for (const e of edges) {
    const a = pos[e.s], b = pos[e.t]; if (!a || !b) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1, rest = 110;
    const f = (d - rest) * 0.004, ux = dx / d, uy = dy / d;
    a.x += ux * f; a.y += uy * f; b.x -= ux * f; b.y -= uy * f;
  }
  // 중심引力
  for (const id in pos) { pos[id].x += (700 - pos[id].x) * 0.002; pos[id].y += (450 - pos[id].y) * 0.002; }
}
let cam = { x: 0, y: 0, z: 0.28 };
function draw() {
  ctx.fillStyle = '#0e1116'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(cam.z, cam.z); ctx.translate(-cam.x, -cam.y);
  ctx.strokeStyle = '#2b3138';
  for (const e of edges) { const a = pos[e.s], b = pos[e.t]; if (!a || !b) continue; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  for (const n of nodes) {
    const p = pos[n.id]; if (!p) continue;
    const r = n.type === 'video' ? 3.5 + Math.log(n.views + 10) * 0.9 : n.type === 'chart' ? 5 : n.type === 'series' ? 9 : 5 + Math.min(8, (n.count || 0) * 0.35);
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fillStyle = cOf(n); ctx.fill();
    if (n.id === focusId || cam.z > 1.4 && n.type !== 'video') { ctx.fillStyle = '#e6edf3'; ctx.font = '11px sans-serif'; ctx.fillText(n.label.slice(0, 24), p.x + r + 3, p.y + 4); }
    else if (n.type === 'series' || (n.type !== 'video' && cam.z > 0.8)) { ctx.fillStyle = '#c9d1d9'; ctx.font = '11px sans-serif'; ctx.fillText(n.label.slice(0, 20), p.x + r + 3, p.y + 4); }
  }
  ctx.restore();
}
function loop() { if (running) { step(); draw(); } requestAnimationFrame(loop); }
loop(); running = true; draw();
// 줌/팬
cv.addEventListener('wheel', e => { e.preventDefault(); const k = e.deltaY < 0 ? 1.12 : 0.9; const mx = (e.offsetX - W / 2) / cam.z + cam.x, my = (e.offsetY - H / 2) / cam.z + cam.y; cam.z = Math.max(0.05, Math.min(8, cam.z * k)); cam.x = mx - (e.offsetX - W / 2) / cam.z; cam.y = my - (e.offsetY - H / 2) / cam.z; if (!running) draw(); }, { passive: false });
let drag = null;
cv.addEventListener('mousedown', e => drag = { x: e.offsetX, y: e.offsetY, cx: cam.x, cy: cam.y });
addEventListener('mousemove', e => { if (drag) { cam.x = drag.cx - (e.offsetX - drag.x) / cam.z; cam.y = drag.cy - (e.offsetY - drag.y) / cam.z; if (!running) draw(); } });
addEventListener('mouseup', () => drag = null);
function toWorld(e) { return { x: (e.offsetX - W / 2) / cam.z + cam.x, y: (e.offsetY - H / 2) / cam.z + cam.y }; }
cv.addEventListener('click', e => {
  const w = toWorld(e); let best = null, bd = 12 / cam.z;
  for (const n of nodes) { const p = pos[n.id]; if (!p) continue; const d = Math.hypot(p.x - w.x, p.y - w.y); if (d < bd) { bd = d; best = n; } }
  if (best) { if (best.type === 'video') return openVideo(best); showNode(best.id); }
});
function openVideo(n) {
  const url = 'https://www.youtube.com/watch?v=' + n.id.slice(2) + (lastT ? '&t=' + lastT + 's' : '');
  window.open(url, '_blank');
}
let lastT = null;
function showNode(id) {
  focusId = id; const n = byId[id]; lastT = null;
  cam.x = pos[id].x; cam.y = pos[id].y; if (cam.z < 1) cam.z = 1.6;
  let html = '<h3>' + esc(n.label) + '</h3>';
  html += '<div class="legend"><span><span class="dot" style="background:' + cOf(n) + '"></span>' + typeLabel(n.type) + '</span>' + (n.date ? '<span>' + n.date + '</span>' : '') + (n.views ? '<span>조회 ' + n.views.toLocaleString() + '</span>' : '') + (n.count != null ? '<span>언급 ' + n.count + '영상</span>' : '') + '</div>';
  const rel = (adj[id] || []).slice().sort((a, b) => b.w - a.w);
  if (n.type === 'video') {
    html += '<h3>관련 개념</h3>';
    for (const r of rel) { const rn = byId[r.id]; if (!rn || rn.type !== 'chart' && rn.type !== 'series' && rn.type === 'video') continue; if (rn.type === 'video') continue; html += '<div class="item" onclick="showNode(\'' + r.id + '\')"><div class="t">' + esc(rn.label) + '</div><div class="m">언급 ' + r.w + '회' + (r.f != null ? ' · 첫 등장 ' + fmt(r.f) : '') + '</div></div>'; }
    html += '<h3>바로가기</h3><div class="item" onclick="window.open(\'https://www.youtube.com/watch?v=' + n.id.slice(2) + '\')">YouTube에서 보기 ↗</div><div class="item" onclick="window.open(\'../videos/' + n.file + '\')">문서 전체 보기 ↗</div>';
  } else {
    html += '<h3>연결 영상 ' + rel.filter(r => byId[r.id]?.type === 'video').length + '개</h3>';
    const vids = rel.filter(r => byId[r.id]?.type === 'video').sort((a, b) => (byId[b.id].date || '').localeCompare(byId[a.id].date || ''));
    for (const r of vids) { const rn = byId[r.id]; html += '<div class="item" onclick="jump(\'' + r.id + '\',' + (r.f ?? 0) + ')"><div class="t">' + esc(rn.label) + '</div><div class="m">' + rn.date + ' · 첫 언급 ' + (r.f != null ? fmt(r.f) : '-') + '</div></div>'; }
  }
  $side.innerHTML = html;
}
function jump(vid, t) { const n = byId['v:' + vid]; window.open('https://www.youtube.com/watch?v=' + vid + '&t=' + t + 's', '_blank'); }
function typeLabel(t) { return { video: '영상', series: '시리즈', chart: '원국(칠판 판독)', '일간': '일간', '합충': '합충', '십성': '십성', '신살': '신살', '오행': '오행', '주제': '주제', '물상론': '물상론', '개념': '개념' }[t] || t; }
function fmt(s) { s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

/* ---- 검색 ---- */
const norm = s => s.replace(/\s+/g, '');
$q.addEventListener('input', () => { clearTimeout(window._t); window._t = setTimeout(doSearch, 250); });
document.getElementById('mode').addEventListener('change', doSearch);
function doSearch() {
  const q = norm($q.value), mode = document.getElementById('mode').value;
  if (!q) { $side.innerHTML = '<div class="empty">검색어를 입력하세요</div>'; return; }
  // 개념 그래프 검색
  const cn = nodes.filter(n => n.type !== 'video' && norm(n.label).includes(q)).sort((a, b) => (b.count || 0) - (a.count || 0));
  // 자막 전문 검색
  const wantSeg = mode === 'seg' || (mode === 'auto' && cn.length === 0);
  let html = '<h3>개념 ' + cn.length + '개</h3>';
  for (const n of cn.slice(0, 12)) html += '<div class="item" onclick="showNode(\'' + n.id + '\')"><div class="t">' + esc(n.label) + '</div><div class="m">' + typeLabel(n.type) + ' · 언급 ' + n.count + '영상</div></div>';
  if (wantSeg || q.length >= 2) {
    const hits = []; const ql = q;
    for (const s of segs) { const i = s.x.replace(/\s+/g, '').indexOf(ql); if (i >= 0) { hits.push(s); if (hits.length >= 80) break; } }
    html += '<h3>자막 전문 ' + hits.length + '건</h3>';
    for (const h of hits.slice(0, 60)) {
      const i = h.x.replace(/\s+/g, '').indexOf(ql);
      const raw = h.x, ri = raw.replace(/\s+/g, '').indexOf(ql);
      const s2 = Math.max(0, ri - 18);
      html += '<div class="seg" onclick="jump(\'' + h.v + '\',' + h.t + ')"><span class="tt">' + fmt(h.t) + '</span>' + esc2(raw, ql) + '<div style="color:var(--sub);font-size:11.5px;margin-top:2px">' + vidTitle(h.v) + ' ↗</div></div>';
    }
    if (!hits.length && !cn.length) html = '<div class="empty">검색 결과가 없습니다</div>';
  }
  $side.innerHTML = html;
  $stat.textContent = $side.querySelectorAll('.item,.seg').length + '건';
}
const VT = {}; nodes.forEach(n => { if (n.type === 'video') VT[n.id.slice(2)] = n.label; });
function vidTitle(v) { return (VT[v] || v).slice(0, 30); }
function esc2(raw, q) {
  const flat = raw.replace(/\s+/g, ''); const i = flat.indexOf(q); if (i < 0) return esc(raw.slice(0, 60));
  // 원문에서 대략 위치 매핑
  let cnt = 0, start = 0, end = raw.length;
  for (let j = 0; j < raw.length; j++) { if (raw[j] !== ' ' && raw[j] !== '\n') { if (cnt === i) { start = j; break; } cnt++; } }
  return esc(raw.slice(Math.max(0, start - 20), start + q.length + 40));
}
$stat.textContent = nodes.length + ' 노드 / ' + edges.length + ' 엣지 / ' + segs.length + ' 자막 세그먼트';
</script>
</body>
</html>
